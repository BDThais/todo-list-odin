<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>
    <header>
        <div id="header-title">
            <div class="brand-mark">✓</div>
            <div>
                <p class="eyebrow">Workspace</p>
                <h1>A Simple Todo List</h1>
            </div>
        </div>
    </header>
    <div id="main-container">
        <div id="main">
            <div id="side-bar">
                <div id="project-tab">
                    <div class="project-tab-header">
                        <h2>Projects</h2>
                    </div>
                    <div class="project-tab-content"></div>
                </div>
            </div>
            <div id="content">
                <div id="todo-tab">
                    <div class="todo-tab-header">
                        <h2>Todo Items</h2>
                    </div>
                    <div class="todo-tab-content"></div>
                </div>
            </div>
            <div id="add-button" aria-label="Add new item">+</div>
        </div>
    </div>
</body>

</html>
